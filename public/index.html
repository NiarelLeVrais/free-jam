<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE JAM</title>
    <meta name="description" content="FREE JAM : crée un Jam Spotify et écoute en groupe. Les invités ajoutent des musiques à la file, l'hôte contrôle la lecture.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="FREE JAM">
    <meta property="og:description" content="Crée un Jam Spotify et écoute en groupe.">
    <meta property="og:image" content="logo.png">

    <!-- Polices : preconnect + display=swap (pas de @import bloquant) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link href="style.css" rel="stylesheet" />
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Formes Wrapped sur les côtés (PC) - remplies par script.js -->
    <div class="sideShapes left" data-cols="3"></div>
    <div class="sideShapes right" data-cols="3"></div>

    <!-- Transition iris : disque plein puis trou transparent -->
    <div id="flood"></div>
    <div id="cutter"></div>

    <!-- ===== VUE LANDING (déconnecté) ===== -->
    <section id="landing" class="view">
        <img class="logo" src="logo.png" alt="FREE JAM">
        <div id="authButtons" class="authButtons">
            <a id="login" class="bigBtn spotify" href="/login" data-i18n="loginSpotify">Se connecter avec Spotify</a>
            <a id="joinJam" class="bigBtn jam" href="#" data-i18n="joinJam">Se connecter à un Jam</a>
        </div>
    </section>

    <!-- ===== VUE REJOINDRE UN JAM (invité saisit le code) ===== -->
    <section id="jamView" class="view hidden">
        <img class="logo" src="logo.png" alt="FREE JAM">
        <h2 data-i18n="joinJamTitle">Rejoindre un Jam</h2>
        <div class="searchBar">
            <label for="jamCode" class="srOnly" data-i18n="jamCodeLabel">Code du Jam</label>
            <input id="jamCode" type="text" placeholder="Code du Jam..." data-i18n-placeholder="jamCodePlaceholder" maxlength="5" autocomplete="off" autocapitalize="characters">
            <button id="jamJoinBtn" data-i18n="join">Rejoindre</button>
        </div>
        <div id="jamJoinError" class="errorMsg"></div>
        <button id="jamBack" class="bigBtn ghost" data-i18n="back">Retour</button>
    </section>

    <!-- ===== VUE HOME (connecté, pas en Jam) ===== -->
    <section id="appView" class="view hidden">
        <img class="logo" src="logo.png" alt="FREE JAM">

        <div class="profile">
            <img id="profileimage" alt="profil" width="80">
            <div>
                <div id="name"></div>
                <div id="iscon"></div>
            </div>
            <a id="disconect" href="/disconect" data-i18n="disconnect">Se déconnecter</a>
        </div>

        <button id="createJamBtn" class="bigBtn jam" data-i18n="createJam">Créer un Jam</button>
    </section>

    <!-- ===== VUE SALLE JAM (host + invité) ===== -->
    <section id="jamRoom" class="view hidden">
        <img class="logo" src="logo.png" alt="FREE JAM">

        <div class="jamHeader">
            <div class="jamCode"><span id="jamCodeLabel"></span></div>
            <div id="jamHostLabel" class="jamSub"></div>
            <div id="jamMembers" class="jamSub"></div>
        </div>

        <button id="jamInvite" class="inviteBtn" data-i18n="copyInvite">Copier le lien d'invitation</button>

        <!-- Contrôles : host uniquement -->
        <div class="jamControls hostOnly">
            <button id="jamPlayPause" class="iconBtn" title="Lecture / Pause" data-i18n-title="playPause"></button>
            <button id="jamSkip" class="iconBtn" title="Suivante" data-i18n-title="next">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2.4V6H16z"/></svg>
            </button>
            <button id="jamStop" class="stopBtn" data-i18n="stopJam">Arrêter le Jam</button>
        </div>

        <h2 data-i18n="nowPlaying">Lecture en cours</h2>
        <div class="track" id="jamTrack">
            <div id="jamTrackName"></div>
            <img id="jamTrackImg" alt="" width="220" height="220">
        </div>

        <h3 data-i18n="addMusic">Ajouter une musique</h3>
        <div class="searchBar">
            <label for="jamSearchInput" class="srOnly" data-i18n="searchLabel">Rechercher une musique</label>
            <input id="jamSearchInput" type="text" placeholder="Titre, artiste..." data-i18n-placeholder="searchPlaceholder">
            <button id="jamSearchBtn" data-i18n="search">Chercher</button>
        </div>
        <div id="jamResults"></div>

        <div class="jamBar">
            <h3 data-i18n="queue">File d'attente</h3>
            <button id="jamRefresh" title="Rafraîchir" data-i18n-title="refresh">↻</button>
        </div>
        <div id="jamQueue"></div>

        <!-- Quitter : invité uniquement (le host utilise Arrêter) -->
        <button id="jamLeave" class="bigBtn ghost guestOnly" data-i18n="leaveJam">Quitter le Jam</button>
    </section>

    <!-- Toasts (erreurs / infos non bloquantes) -->
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

    <!-- Confirm custom (remplace confirm() natif) -->
    <div id="confirmOverlay" class="confirmOverlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirmText">
        <div class="confirmBox">
            <p id="confirmText"></p>
            <div class="confirmActions">
                <button id="confirmCancel" class="bigBtn ghost" data-i18n="cancel">Annuler</button>
                <button id="confirmOk" class="stopBtn" data-i18n="confirm">Confirmer</button>
            </div>
        </div>
    </div>

    <!-- Bascule langue FR / EN (style Spotify, pill segmentee) -->
    <div class="langToggle" role="group" aria-label="Langue / Language">
        <button id="langFr" type="button" data-lang="fr">FR</button>
        <button id="langEn" type="button" data-lang="en">EN</button>
    </div>

</body>

</html>
