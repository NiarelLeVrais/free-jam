<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link href="style.css" rel="stylesheet" />
    <title>FREE JAM</title>
</head>

<body>

    <!-- Formes Wrapped sur les côtés (PC uniquement) -->
    <div class="sideShapes left">
        <span class="shape cube"></span>
        <span class="shape triangle"></span>
        <span class="shape half"></span>
        <span class="shape circle"></span>
    </div>
    <div class="sideShapes right">
        <span class="shape triangle"></span>
        <span class="shape circle"></span>
        <span class="shape cube"></span>
        <span class="shape half"></span>
    </div>

    <!-- Blobs liquides de fond -->
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <!-- Overlay transition "Mario" (couleur qui inonde l'écran) -->
    <div id="flood"></div>

    <!-- ===== VUE LANDING (déconnecté) ===== -->
    <section id="landing" class="view">
        <img class="logo" src="logo.png" alt="FREE JAM">
        <div id="authButtons" class="authButtons">
            <a id="login" class="bigBtn spotify" href="/login">Se connecter avec Spotify</a>
            <a id="joinJam" class="bigBtn jam" href="#">Se connecter à un Jam</a>
        </div>
    </section>

    <!-- ===== VUE JAM (rejoindre une session) — stub ===== -->
    <section id="jamView" class="view hidden">
        <img class="logo" src="logo.png" alt="FREE JAM">
        <h2>Rejoindre un Jam</h2>
        <div class="searchBar">
            <input id="jamCode" type="text" placeholder="Code du Jam...">
            <button id="jamJoinBtn">Rejoindre</button>
        </div>
        <button id="jamBack" class="bigBtn ghost">Retour</button>
    </section>

    <!-- ===== VUE APP (connecté) ===== -->
    <section id="appView" class="view hidden">
        <img class="logo" src="logo.png" alt="FREE JAM">

        <div class="profile">
            <img id="profileimage" alt="profil" width="80">
            <div>
                <div id="name"></div>
                <div id="iscon"></div>
            </div>
            <a id="disconect" href="/disconect">Se déconecter</a>
        </div>

        <div class="bouton">
            <button id="curentbouton">Curent Track</button>
            <button id="listbutton">List</button>
        </div>

        <h2>Curent song :</h2>
        <div class="track" id="track">
            <div id="trackname"></div>
            <img id="trackimg" width="160">
        </div>

        <h3>Rechercher</h3>
        <div class="searchBar">
            <input id="searchInput" type="text" placeholder="Titre, artiste...">
            <button id="searchButton">Chercher</button>
        </div>
        <div id="searchResults"></div>

        <h3>Next Song</h3>
        <div id="file"></div>
    </section>

</body>

</html>
